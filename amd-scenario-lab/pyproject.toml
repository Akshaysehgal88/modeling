[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amd-scenario-lab"
version = "1.0.0"
description = "Public-source AMD scenario modeling with explicit forecast assumptions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["numpy>=1.26,<3", "pandas>=2.0,<4"]

[project.optional-dependencies]
ui = ["streamlit>=1.39,<2", "plotly>=5.24,<7"]
dev = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
amd-lab = "amd_scenario_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
amd_scenario_lab = ["data/*.json"]

[tool.setuptools.data-files]
"share/amd-scenario-lab/docs" = ["docs/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
