name: AMD Scenario Lab
on:
  push:
    paths: ['amd-scenario-lab/**', '.github/workflows/amd-scenario-lab.yml']
  pull_request:
    paths: ['amd-scenario-lab/**', '.github/workflows/amd-scenario-lab.yml']
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: amd-scenario-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[ui,dev]"
      - run: python -m pytest
      - run: python -m build
      - run: python -m amd_scenario_lab run --out outputs/ci-demo
